<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 4 - Special Day</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('bgstep4.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
      color: #222;
    }

    .box {
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      padding: 25px;
      max-width: 350px;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.4;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: red;
      color: white;
    }

    #videoContainer {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
    }

    video {
      width: 400px;
      border-radius: 12px;
    }

    #timer {
      margin-top: 8px;
      font-weight: bold;
      background: rgba(255,255,255,0.7);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .popup {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 15px;
      font-weight: bold;
      font-size: 18px;
      border: 2px solid red;
    }
  </style>
</head>
<body>

  <div id="mainBox" class="box" style="top:45%; left:50%; transform:translate(-50%,-50%);">
    Suna hai Aj kuch special hai wese 👀....
    <br><br>
    <button onclick="clickedYes(this)">Han hai 🙂</button>
    <button onclick="clickedNo(this)">Nahi to 🥲</button>
  </div>

  <div id="videoContainer">
    <video id="video1" src="videostep4.mp4"></video>
    <div id="timer">7</div>
  </div>

  <audio id="sound"></audio>

  <script>
    const sound = document.getElementById("sound");

    function playSound(name) {
      sound.src = name;
      sound.play();
    }

    function showPopup(msg, duration=1200) {
      let pop = document.createElement("div");
      pop.className = "popup";
      pop.innerText = msg;
      pop.style.top = Math.random()*60 + "%";
      pop.style.left = Math.random()*60 + "%";
      document.body.appendChild(pop);
      setTimeout(()=> pop.remove(), duration);
    }

    // --- Individual button handling (no disabling of other boxes) ---
    function clickedNo(btn){
      btn.disabled = true;
      playSound("nahisound1.mp3");
      showPopup("Kyu jhuth bol rhe ho 😏");
    }

    function clickedYes(btn){
      btn.disabled = true;
      playSound("yes1.mp3");
      makeBox("Kya hai aaj is din me hame bataoge ya nhi😁",
        [{txt:"Zrur bataenge", fn:"clickedYes2(this)"},
         {txt:"Majboori me bata rhe😶", fn:"clickedYes2(this)"}]);
    }

    function clickedYes2(btn){
      btn.disabled = true;
      playSound("yes2.mp3");
      makeBox("Aaj kisi ka Janamdin hai kya😶",
        [{txt:"haaan", fn:"clickedYes3(this)"},
         {txt:"Naah ka jawab hi nhi", fn:"clickedYes3(this)"}]);
    }

    function clickedYes3(btn){
      btn.disabled = true;
      playSound("yes3.mp3");
      makeBox("For Next step click me",
        [{txt:"Proceed😶", fn:"clickedYes4(this)"}]);
    }

    function clickedYes4(btn){
      btn.disabled = true;
      playSound("yes4.mp3");
      makeBox("Sach me aage badnaa hai",
        [{txt:"Hmmm", fn:"clickedYes5(this)"}]);
    }

    function clickedYes5(btn){
      btn.disabled = true;
      playSound("yes5.mp3");
      makeBox("Sachi sachi bolo😁",
        [{txt:"Are Haan baba", fn:"clickedYes6(this)"}]);
    }

    function clickedYes6(btn){
      btn.disabled = true;
      playSound("yes6.mp3");
      makeBox("Pakka na",
        [{txt:"Are kitna pareshan karoge🤦🏻‍♀️", fn:"clickedYes7(this)"}]);
    }

    function clickedYes7(btn){
      btn.disabled = true;
      playSound("yes7.mp3");
      makeBox("Chalo itna bol rhe ho to aage badte hai ab",
        [{txt:"CHALOOOO😁", fn:"finalProceed(this)"}]);
    }

    function makeBox(text, buttons){
      let box = document.createElement("div");
      box.className = "box";
      box.style.top = Math.random()*60 + "%";
      box.style.left = Math.random()*60 + "%";
      box.innerHTML = text + "<br><br>";
      buttons.forEach(b=>{
        box.innerHTML += `<button onclick="${b.fn}">${b.txt}</button>`;
      });
      document.body.appendChild(box);
    }

    function finalProceed(btn){
      btn.disabled = true;
      playSound("yes8.mp3");
      setTimeout(()=>{
        startVideos();
      }, 1200);
    }

    // --- Video logic remains same ---
    function startVideos(){
      const vidContainer = document.getElementById("videoContainer");
      const video1 = document.getElementById("video1");
      const timer = document.getElementById("timer");

      vidContainer.style.display = "flex";
      video1.play();

      let time = 7;
      const t1 = setInterval(()=>{
        time--;
        timer.innerText = time;
        if(time<=0){
          clearInterval(t1);
          playSecondVideo();
        }
      },1000);

      video1.onended = ()=> playSecondVideo();
    }

    function playSecondVideo(){
      const video1 = document.getElementById("video1");
      video1.src = "video2step4.mp4";
      const timer = document.getElementById("timer");
      let time = 10;
      timer.innerText = time;
      video1.play();

      const t2 = setInterval(()=>{
        time--;
        timer.innerText = time;
        if(time<=0){
          clearInterval(t2);
          window.location.href = "step5.html";
        }
      },1000);

      video1.onended = ()=> window.location.href = "step5.html";
    }
  </script>

</body>
</html>
