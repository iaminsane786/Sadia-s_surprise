<!DOCTYPE html>
<html lang="en">
<head>

  <title>Step 5 - Princess Reveal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('bgstep5.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .caption {
      max-width: 80%;
      font-size: 20px;
      line-height: 1.6;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      margin-bottom: 20px;

    video {

<body>

  <video id="video1" src="video3.mp4" autoplay></video>

  <script>
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');

    video1.addEventListener('ended', () => {
      video1.style.display = 'none';
      video2.style.display = 'block';
