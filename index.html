<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1 - Surprise</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('assets/images/bgstep1.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    .box {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 40px;
      border-radius: 15px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .box p {
      font-size: 20px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      margin: 10px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }

    .btn-yes { background-color: #28a745; }
    .btn-no { background-color: #dc3545; }

    .temp-msg {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 22px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="temp-msg" id="tempMsg">Kamjor Dil wale Dur Raheeen.....</div>

  <div class="box">
    <p>
      AAJ ME EK KHAAS SHAKS 😶 KE BAARE ME BATANE JAA RHA HUN  
      JISKI AANKON ME TOOFAN🌪️ HAI  
      BAATON ME AANDHI ⛈️ HAI,  
      AWAZ ME BIJLI ⚡ HAI  
      AUR GUSSE ME WO TAMATAR 🍅 HAI.  
      SUNNA CHAHOGE !!!
    </p>
    <button class="btn btn-yes" onclick="goStep2()">HAN SUNNA CHAHENGE😲</button>
    <button class="btn btn-no" onclick="showTempMsg()">NAHI DarRrr... Lag rha hai😨</button>
  </div>

  <audio id="bgMusic" src="assets/audio/bgmusicstep1.mp3" loop autoplay></audio>

  <script>
    // Show temporary message for 1.5 seconds
    function showTempMsg() {
      const msg = document.getElementById('tempMsg');
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 1500);
    }

    // Go to Step 2
    function goStep2() {
      window.location.href = 'step2.html';
    }

    // Optional autoplay fix for browsers
    document.body.addEventListener('click', () => {
      const bgMusic = document.getElementById('bgMusic');
      if (bgMusic.paused) bgMusic.play();
    }, { once: true });
  </script>

</body>
</html>
